name: BakkiesSA Ingest

# The bakkie market (Ranger, D-Max, Amarok, P-Series … 26 families) crawled in
# its OWN pass — the Jimny pattern: same scrapers, SCRAPE_SEGMENT=bakkie, routed
# to bakkiessa (SITE_URL/INGEST_TOKEN = BAKKIES_*). Split out of the LC run on
# 2026-09-18: adding the roster there pushed AutoTrader past its job timeout and
# broke the Cars.co.za session three days running. Hilux/Fortuner still ride
# the LC run and fan out to both sites; WBC/WBB are one cheap API pass and
# also stay in the LC run with fan-out.

on:
  schedule:
    - cron: '0 6 * * *'   # daily, 06:00 UTC (08:00 SAST) — after the LC AT (03:00) + carsza (04:00) runs
  workflow_dispatch:

concurrency:
  group: bakkies
  cancel-in-progress: false

env:
  SCRAPE_SEGMENT: bakkie
  INGEST_TOKEN: ${{ secrets.BAKKIES_INGEST_TOKEN }}
  SITE_URL: ${{ secrets.BAKKIES_SITE_URL }}

jobs:
  bakkies:
    name: BakkiesSA (AT + cars.co.za via proxy, then backfills)
    runs-on: ubuntu-latest
    # Ranger alone is thousands of AT tiles; give the pass the room the LC
    # run never had. GitHub's ceiling is 360.
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: AutoTrader (bakkies, via proxy)
        continue-on-error: true
        run: node --experimental-strip-types src/scripts/ingest-autotrader.ts
        env:
          # Off-market reconciliation live (capHit + 25% breaker guard partial crawls).
          RECONCILE_OFFMARKET: '1'
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          PROXY_HOST: ${{ secrets.PROXY_HOST }}
          PROXY_PORT: ${{ secrets.PROXY_PORT }}
          PROXY_USER: ${{ secrets.PROXY_USER }}
          PROXY_PASS: ${{ secrets.PROXY_PASS }}

      - name: cars.co.za (bakkies, headed Chrome/xvfb + proxy)
        continue-on-error: true
        run: xvfb-run --auto-servernum node --experimental-strip-types src/scripts/ingest-carsza.ts
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          PROXY_HOST: ${{ secrets.PROXY_HOST }}
          PROXY_PORT: ${{ secrets.PROXY_PORT }}
          PROXY_USER: ${{ secrets.PROXY_USER }}
          PROXY_PASS: ${{ secrets.PROXY_PASS }}

      # Galleries + seller descriptions for EVERY AT row on BakkiesSA (bakkies
      # and the fanned-out Hilux/Fortuner) — its endpoints ignore segments.
      - name: Backfill AT galleries (BakkiesSA)
        if: always()
        continue-on-error: true
        run: node --experimental-strip-types scripts/backfill-at-images.ts
        env:
          BATCH_SIZE: '150'
          DELAY_MS: '2500'
          PROXY_HOST: ${{ secrets.PROXY_HOST }}
          PROXY_PORT: ${{ secrets.PROXY_PORT }}
          PROXY_USER: ${{ secrets.PROXY_USER }}
          PROXY_PASS: ${{ secrets.PROXY_PASS }}

      - name: Backfill AT descriptions (BakkiesSA)
        if: always()
        continue-on-error: true
        run: node --experimental-strip-types src/scripts/backfill-at-descriptions.ts
        env:
          PROXY_HOST: ${{ secrets.PROXY_HOST }}
          PROXY_PORT: ${{ secrets.PROXY_PORT }}
          PROXY_USER: ${{ secrets.PROXY_USER }}
          PROXY_PASS: ${{ secrets.PROXY_PASS }}
