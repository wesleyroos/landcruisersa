name: Poll Liveness

on:
  schedule:
    - cron: '30 */6 * * *'  # every 6 hours, offset from ingest
  workflow_dispatch:

jobs:
  poll:
    name: Check Liveness
    runs-on: ubuntu-latest
    # 60, not 30: the LC pass alone now takes the full 30 min (648 pollable
    # listings x ~2.8s of WBC get-car verification) and the Jimny pass runs
    # after it, so every run since at least 2026-08-20 was CANCELLED mid-poll —
    # the tail of the queue never got checked and the workflow showed red.
    # 150 (was 60): three passes now — LC (~40 min of WBC get-car checks),
    # Jimny, BakkiesSA — and the third was being killed at the old limit.
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Poll listing liveness (Land Cruiser SA)
        run: node --experimental-strip-types src/scripts/poll-liveness.ts
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          SITE_URL: ${{ secrets.SITE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          # AutoTrader is reconciled at ingest (it can't be liveness-polled); cap the
          # rest so the poll finishes well under the 30-min timeout.
          POLL_SKIP: autotrader
          POLL_CAP: '800'

      # Same script, pointed at the Jimny site (separate DB) — mirrors how ingest
      # splits per segment. always() so a hiccup in the LC pass can't skip Jimny.
      - name: Poll listing liveness (Jimny SA)
        if: always()
        run: node --experimental-strip-types src/scripts/poll-liveness.ts
        env:
          SCRAPE_SEGMENT: jimny
          INGEST_TOKEN: ${{ secrets.JIMNY_INGEST_TOKEN }}
          SITE_URL: ${{ secrets.JIMNY_SITE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          POLL_SKIP: autotrader
          POLL_CAP: '800'

      # BakkiesSA pass — its own DB holds the bakkie + Hilux/Fortuner rows; WBC
      # get-car verification is the delist signal that makes the "sold comps"
      # data honest, so this pass is not optional.
      - name: Poll listing liveness (BakkiesSA)
        if: always()
        run: node --experimental-strip-types src/scripts/poll-liveness.ts
        env:
          SCRAPE_SEGMENT: bakkie
          INGEST_TOKEN: ${{ secrets.BAKKIES_INGEST_TOKEN }}
          SITE_URL: ${{ secrets.BAKKIES_SITE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          POLL_SKIP: autotrader
          POLL_CAP: '500'
